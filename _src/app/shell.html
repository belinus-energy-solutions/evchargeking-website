<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--HEAD-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/ArialNova-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css?v=__V__">
</head>
<body>
<div class="top"><div class="wrap" id="topmsg"></div></div>
<header class="main"><div class="wrap">
  <button class="iconbtn plain" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false"><span class="burger"><i></i><i></i><i></i></span></button>
  <a class="brand" href="#home" aria-label="EVChargeking home"><img class="logo-img" src="/img/logo.png" alt="EVChargeking"><small id="groupTag"></small></a>
  <div class="hspace"></div>
  <button class="region" id="regionBtn" type="button"><span class="dot"></span><span class="long" id="rCountry"></span><span class="short" id="rCode"></span><span class="sep">·</span><span id="rLang"></span></button>
  <button class="iconbtn" id="themeBtn" type="button"></button>
  <button class="cartbtn" id="cartBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6l2-8H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span class="lbl" id="cartLbl"></span><span class="n" id="cartN">0</span></button>
</div></header>

<main id="app">
  <div class="view" id="v-home"></div>
  <div class="view" id="v-shop" hidden></div>
  <div class="view" id="v-product" hidden></div>
  <div class="view" id="v-finder" hidden></div>
  <div class="view" id="v-calc" hidden></div>
  <div class="view" id="v-etappro" hidden></div>
  <div class="view" id="v-support" hidden></div>
  <div class="view" id="v-about" hidden></div>
  <div class="view" id="v-legal" hidden></div>
  <div class="view" id="v-account" hidden></div>
  <div class="view" id="v-checkout" hidden></div>
  <div class="view" id="v-done" hidden></div>
  <div class="view" id="v-paytest" hidden></div>
  <div class="view" id="v-notes" hidden></div>
</main>

<footer class="site"><div class="wrap"><div class="cols" id="footCols"></div><div class="fine" id="footFine"></div></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="menuPanel" aria-label="Menu"><header><span class="plabel" id="menuTitle"></span><button class="xbtn" data-close aria-label="Close">×</button></header><div class="pbody"><nav class="mnav" id="menuNav"></nav></div><footer id="menuFoot"></footer></aside>
<aside class="panel" id="regionPanel" aria-label="Region"><header><span class="plabel" id="regionTitle"></span><button class="xbtn" data-close aria-label="Close">×</button></header><div class="pbody" id="regionList"></div><footer id="regionFoot"></footer></aside>
<div class="modal" id="locModal" role="dialog" aria-modal="true" aria-labelledby="locH"></div>
<div class="cookie" id="cookieBox" role="dialog" aria-labelledby="ckH"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <header><h3 id="d-title"></h3><button class="xbtn" id="closeCart" aria-label="Close cart">×</button></header>
  <div class="body" id="cartBody"></div>
  <footer id="cartFoot"></footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="/assets/data.js?v=__V__"></script>
<script src="/assets/app.js?v=__V__"></script>
</body>
</html>
