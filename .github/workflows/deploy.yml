name: Deploy to Bunny CDN

# Every push to main uploads the built site to Bunny Storage and purges the CDN cache.
# The first run also creates the storage zone and pull zone if they do not exist yet.
# Needs the organisation secret BUNNY_API_KEY. Commits containing [skip deploy] are not deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ZONE_NAME: "evchargeking-website"

concurrency:
  group: deploy-evchargeking
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or create the Bunny zones
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "AccessKey: $BUNNY_API_KEY" -H "Content-Type: application/json" "$@"; }
          find_id() { python3 -c 'import sys,json;d=json.load(sys.stdin);d=d.get("Items",d) if isinstance(d,dict) else d;print(next((str(z["Id"]) for z in d if z["Name"]==sys.argv[1]),""))' "$1"; }
          SZ=$(api "https://api.bunny.net/storagezone?page=1&perPage=1000" | find_id "$ZONE_NAME")
          if [ -z "$SZ" ]; then
            echo "Creating storage zone $ZONE_NAME"
            SZ=$(api -X POST "https://api.bunny.net/storagezone" -d "{\"Name\":\"$ZONE_NAME\",\"Region\":\"DE\",\"ZoneTier\":0}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Id"])')
          fi
          api -X POST "https://api.bunny.net/storagezone/$SZ" -d '{"Custom404FilePath":"/404.html"}' > /dev/null || echo "note: could not set the 404 page"
          PZ=$(api "https://api.bunny.net/pullzone?page=1&perPage=1000" | find_id "$ZONE_NAME")
          if [ -z "$PZ" ]; then
            echo "Creating pull zone $ZONE_NAME"
            PZ=$(api -X POST "https://api.bunny.net/pullzone" -d "{\"Name\":\"$ZONE_NAME\",\"StorageZoneId\":$SZ,\"Type\":0}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Id"])')
          fi
          echo "STORAGE_ZONE_ID=$SZ" >> "$GITHUB_ENV"
          echo "PULLZONE_ID=$PZ" >> "$GITHUB_ENV"
          echo "Storage zone $SZ, pull zone $PZ, preview address https://$ZONE_NAME.b-cdn.net/" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload site files to Bunny Storage
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          SK=$(curl -fsS -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/storagezone/$STORAGE_ZONE_ID" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Password"])')
          echo "::add-mask::$SK"
          export SK
          find . -type f \
            ! -path './.git/*' \
            ! -path './_src/*' \
            ! -path './.github/*' \
            ! -name 'README.md' \
            ! -name 'CLAUDE.md' \
            ! -name '.gitignore' -print0 \
            | xargs -0 -P 8 -I{} sh -c 'f="{}"; rel="${f#./}"; curl -fsS --retry 3 -X PUT -H "AccessKey: $SK" --data-binary "@$f" "https://storage.bunnycdn.com/$ZONE_NAME/$rel" > /dev/null && echo "PUT $rel"'

      - name: Purge pull zone cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -fsS -X POST -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/pullzone/$PULLZONE_ID/purgeCache" -d ''
